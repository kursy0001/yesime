<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dünyanın En Güzeli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&display=swap">
<style>
  /* Düzen: tek sütun, ortada dönen mühür düğmesi; üstte başlık, altta ince alt yazı. Tek bilinçli koyu görünüm. */
  :root {
    --bg: #0c0709;
    --bg-glow: #2a1319;
    --ink: #f4e9e3;
    --rose: #d9a5a0;
    --gold: #c9a66b;
    --muted: #8f7b79;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 0;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 6vh, 56px);
    text-align: center;
    background:
      radial-gradient(60% 45% at 50% 46%, var(--bg-glow) 0%, transparent 70%);
  }
  canvas#dust {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .head, .seal-wrap, .foot { position: relative; z-index: 1; min-width: 0; }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 300;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.4rem, 11vw, 4.4rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
  }
  h1 em {
    font-weight: 500;
    color: var(--rose);
  }

  .seal-wrap { display: grid; place-items: center; }
  .seal {
    position: relative;
    width: min(64vw, 270px);
    aspect-ratio: 1;
    max-width: 100%;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, rgba(217,165,160,0.18), rgba(12,7,9,0) 62%),
      #130a0d;
    box-shadow:
      0 0 0 1px rgba(201,166,107,0.35),
      0 0 60px rgba(217,165,160,0.14),
      inset 0 0 40px rgba(201,166,107,0.07);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(.2,.7,.2,1), box-shadow 0.5s ease;
  }
  .seal:hover { transform: scale(1.025); box-shadow: 0 0 0 1px rgba(201,166,107,0.6), 0 0 80px rgba(217,165,160,0.24), inset 0 0 40px rgba(201,166,107,0.1); }
  .seal:active { transform: scale(0.97); }
  .seal:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: turn 38s linear infinite;
  }
  .ring text {
    font-family: var(--body);
    font-size: 9.6px;
    font-weight: 300;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    fill: var(--gold);
  }
  .core {
    position: absolute;
    inset: 26%;
    display: grid;
    place-items: center;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(217,165,160,0.28);
  }
  .core span {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.5rem, 7vw, 2.2rem);
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .pulse {
    position: absolute;
    inset: 26%;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(217,165,160,0.4);
    animation: pulse 3.2s ease-out infinite;
    pointer-events: none;
  }

  .foot {
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  /* Tıklanınca gelen simsiyah ekran */
  #void {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.8s ease;
    cursor: none;
  }
  #void.on { opacity: 1; pointer-events: auto; }

  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring, .pulse { animation: none; }
    #void { transition: none; }
    .seal { transition: none; }
  }
</style>

<main class="stage">
  <canvas id="dust" aria-hidden="true"></canvas>

  <header class="head">
    <p class="eyebrow">Yeşim, adın düşer geceme ay ışığı gibi, kalbim sana vurur en güzel şiirim.
Gözlerinde kaybolur ruhum; sen baharım, ömrüme yazılmış en güzel mevsim. ❤️</p>
    <h1>Dünyanın en <em>güzel</em> kadınını görmek için</h1>
  </header>

  <div class="seal-wrap">
    <button class="seal" id="go" type="button" aria-label="Dünyanın en güzel kadınını görmek için tıkla">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <path id="circ" d="M100,100 m-86,0 a86,86 0 1,1 172,0 a86,86 0 1,1 -172,0"/>
        </defs>
        <text><textPath href="#circ" startOffset="0"> </textPath></text>
      </svg>
      <span class="pulse" aria-hidden="true"></span>
      <span class="core"><span>Tıkla</span></span>
    </button>
  </div>

  <p class="foot">❤️</p>
</main>

<div id="void" aria-hidden="true"></div>

<script>
(function () {
  var go = document.getElementById('go');
  var voidEl = document.getElementById('void');

  go.addEventListener('click', function () {
    voidEl.classList.add('on');
    voidEl.setAttribute('aria-hidden', 'false');
    document.body.style.background = '#000';
    try {
      var el = document.documentElement;
      if (el.requestFullscreen) { el.requestFullscreen().catch(function () {}); }
    } catch (e) {}
  });

  // Yavaş süzülen toz parçacıkları
  var c = document.getElementById('dust');
  var ctx = c.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var dots = [];

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(70, W * H / 12000));
    dots = [];
    for (var i = 0; i < n; i++) {
      dots.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        v: Math.random() * 0.18 + 0.04,
        a: Math.random() * 0.5 + 0.15,
        t: Math.random() * 6.28
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.t += 0.01;
      if (!reduce) { d.y -= d.v; d.x += Math.sin(d.t) * 0.12; }
      if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(217,175,150,' + (d.a * (0.6 + 0.4 * Math.sin(d.t * 2))) + ')';
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () { resize(); if (reduce) draw(); });
  resize();
  draw();
})();
</script>

</body></html>
